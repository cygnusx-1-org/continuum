# Builds a signed release APK and publishes it as a GitHub release when a version tag is pushed.
# The in-app updater reads the latest release of this repo, so tagging is the whole release step:
#   git tag v8.3.3.9.1.2 && git push origin v8.3.3.9.1.2
# The tag must match versionName in app/build.gradle (with a leading "v").
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    base64 of the release keystore file
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
# Every release must be signed with the same key, or Android refuses to install it as an update.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION_NAME=$(grep '^[[:space:]]*versionName[[:space:]]*"' app/build.gradle | head -n1 | awk '{ print $2 }' | tr -d '"')
          if [ "v${VERSION_NAME}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName v${VERSION_NAME}" >&2
            exit 1
          fi

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk \
            --title "Continuumjr ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Upload APKs (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/release/*.apk
