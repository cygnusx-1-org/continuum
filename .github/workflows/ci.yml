# Compiles every push to master and every pull request, and runs the unit tests, so a broken
# change shows up here instead of in a release build. The Release workflow only runs for tags.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # app/src/main/assets/random_subreddits/*.txt are symlinks to a sibling checkout.
      - name: Fetch subreddit lists
        run: git clone --depth 1 https://github.com/cygnusx-1-org/subreddit-lists.git "$GITHUB_WORKSPACE/../subreddit-lists"

      - name: Compile (unsigned)
        run: ./gradlew assembleRelease --build-cache -Dlint.baselines.continue=true

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch subreddit lists
        run: git clone --depth 1 https://github.com/cygnusx-1-org/subreddit-lists.git "$GITHUB_WORKSPACE/../subreddit-lists"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --build-cache

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
