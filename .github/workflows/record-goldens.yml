name: Record goldens
on:
  push:
    branches: [record-goldens]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch subreddit lists
        run: git clone --depth 1 https://github.com/cygnusx-1-org/subreddit-lists.git "$GITHUB_WORKSPACE/../subreddit-lists"
      - name: Find the goldens that drifted
        run: |
          ./gradlew -q :app:verifyRoborazziDebug --build-cache || true
          python3 - <<'PY'
          import json, os
          d = json.load(open("app/build/test-results/roborazzi/debug/results-summary.json"))
          changed = [r["golden_file_path"] for r in d["results"] if r["type"] == "changed"]
          print(len(changed), "changed")
          open("changed.txt", "w").write("\n".join(os.path.relpath(p, os.getcwd()) for p in changed))
          PY
      - name: Record and commit only those
        run: |
          ./gradlew -q :app:recordRoborazziDebug --build-cache
          xargs -a changed.txt git add
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -m "Re-record the layout goldens for the one-column feed" 
          git push
